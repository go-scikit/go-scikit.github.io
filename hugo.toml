# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.55:1, bright on the dark background 7.58:1.
  base = "#2f3e63"
  deep = "#1d263c"
  bright = "#8fa3c8"
  shadow = "rgba(47,62,99,.7)"
  glow = "rgba(47,62,99,.6)"
  wash = "rgba(47,62,99,.10)"
  washDeep = "rgba(29,38,60,.06)"
  chipBg = "#f2f4f8"
  chipBorder = "#dde3ee"
  chipFg = "#1d263c"
  chipBgDark = "rgba(143,163,200,.14)"
  chipBorderDark = "rgba(143,163,200,.32)"
  chipFgDark = "#c1cce1"
  statsEnd = "#e4e9f2"
  bandText = "#edf0f6"
