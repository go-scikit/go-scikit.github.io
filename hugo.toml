baseURL = 'https://go-scikit.github.io/'
locale  = 'en-us'
title   = 'go-scikit'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html over the shared design.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-scikit: the scientific stack for Go, in pure Go (CGO=0). N-dimensional arrays and NumPy's random numbers, FFTs, optimisation, integration and special functions, probability and statistics, labelled tables, figures and compiled, reactive notebooks, each measured against its Python reference."

# One entry per member organisation, the established ones and those of the
# parity plan alike: the cards in #orgs, the strip under the hero, the stack
# diagram in #stack and the ci check that the page names every organisation
# all come from this list, so every organisation is shown the same way.
# `layer` places it in the stack: 0 the arrays, 1 the libraries that compute
# on them, 2 the notebook. `state` is the release status (the highest tag of
# `lib`, checked with the tags API). `live` means the organisation's landing
# and documentation are published (otherwise the card links to GitHub, not to
# pages that do not exist); `brand` means its logo is published (otherwise
# the card shows the go-scikit mark). Every statement is from the
# organisation's own profile, README or landing, or from the roadmap's
# PLAN.md and STATUS.md.
[[params.orgs]]
  name   = "go-ndarray"
  layer  = 0
  short  = "arrays, numpy.linalg, numpy.random"
  lib    = "ndarray"
  state  = "ndarray v0.18.0"
  live   = true
  brand  = true
  blurb  = "N-dimensional arrays in 13 dtypes with NumPy 2 promotion, broadcasting, strided views and reductions, multicore and SIMD. Package <code>linalg</code> is <code>numpy.linalg</code>, <code>fft</code> is <code>numpy.fft</code>, and <code>random</code> is <code>numpy.random</code> with NumPy's numbers for the same seed."
  playground = "https://go-ndarray.github.io/playground/"
[[params.orgs]]
  name   = "go-fft"
  layer  = 0
  short  = "numpy.fft, scipy.fft"
  lib    = "fft"
  state  = "fft v0.27.3"
  live   = true
  brand  = true
  blurb  = "The <code>numpy.fft</code> / <code>scipy.fft</code> equivalent: complex and real transforms of any length, N-D, the DCT and DST, single precision, windows, with no dependency on FFTW. AVX2 and AVX-512 kernels on amd64, NEON on arm64, bit-identical to the Go code."
  playground = "https://go-fft.github.io/playground/"
[[params.orgs]]
  name   = "go-numerics"
  layer  = 1
  short  = "optimize, integrate, special"
  lib    = "optimize"
  state  = "optimize, integrate, special v0.2.0"
  live   = true
  brand  = true
  blurb  = "Numerical methods ported statement by statement from their reference algorithms: minimisation, roots, least squares and linear programming (<code>optimize</code>); QUADPACK quadrature and ODE solvers (<code>integrate</code>); gamma, beta, error, Bessel and zeta functions measured against mpmath (<code>special</code>)."
  playground = "https://go-numerics.github.io/playground/"
[[params.orgs]]
  name   = "go-statistics"
  layer  = 1
  short  = "distributions, statistics, tests"
  lib    = "stats"
  state  = "stats v0.1.0"
  live   = true
  brand  = true
  blurb  = "32 univariate and 3 multivariate distributions with every method of SciPy's frozen distributions, descriptive statistics with NumPy's 13 quantile methods, and the statistical tests, from t-tests to Shapiro–Wilk and Anderson–Darling."
  playground = "https://go-statistics.github.io/playground/"
[[params.orgs]]
  name   = "go-dataframe"
  layer  = 1
  short  = "labelled tables"
  lib    = "dataframe"
  state  = "dataframe v0.2.0"
  live   = true
  brand  = true
  blurb  = "<code>Series</code>, <code>DataFrame</code> and <code>Index</code> whose numeric columns are go-ndarray arrays: CSV, Arrow and Parquet, group-by, joins, reshaping and time series, giving pandas' answers."
[[params.orgs]]
  name   = "go-plot"
  layer  = 1
  short  = "figures, SVG and PNG"
  lib    = "plot"
  state  = "plot v0.1.1"
  live   = true
  brand  = true
  blurb  = "matplotlib's object model and defaults, figures to SVG and PNG, real TeX in the labels; ticks, colormaps and layout tested equal to matplotlib where they can be equal."
[[params.orgs]]
  name   = "go-notebook"
  layer  = 2
  short  = "compiled, reactive notebooks"
  lib    = "notebook"
  state  = "notebook v0.4.0"
  live   = true
  playground = "https://go-notebook.github.io/playground/"
  brand  = true
  blurb  = "A notebook is a Markdown file whose <code>go</code> and <code>ruby</code> blocks are cells. The kernel compiles it into a real Go program, orders the cells of both languages by what they use, and runs only what changed, keeping values across runs. Ruby cells run on go-embedded-ruby, with the go-scikit bindings."
[[params.orgs]]
  name   = "go-bignum"
  layer  = 1
  short  = "arbitrary precision, oracle harness"
  lib    = "bigfloat"
  state  = "bigfloat v0.1.0"
  live   = true
  brand  = true
  blurb  = "Correctly rounded functions on <code>math/big</code>'s <code>big.Float</code> (exponentials, logarithms, roots, trigonometric, hyperbolic and power functions, constants), checked against mpmath, and the Go oracle harness the other organisations validate with. Ball arithmetic and number theory are planned."
[[params.orgs]]
  name   = "go-sparse"
  layer  = 1
  short  = "scipy.sparse, iterative solvers"
  lib    = "sparse"
  state  = "sparse v0.1.0"
  live   = true
  brand  = true
  blurb  = "CSR, CSC and COO matrices with <code>int32</code> indices as in scipy.sparse, fill-reducing orderings (AMD, COLAMD, RCM) and preconditioned CG, GMRES, MINRES and LSQR with SciPy's iteration counts; every measured case at or below SciPy's time. Direct solvers and sparse eigensolvers are planned."
[[params.orgs]]
  name   = "go-approx"
  layer  = 1
  short  = "interpolation, splines, polynomials"
  lib    = "interp"
  state  = "interp v0.2.1, poly v0.1.0"
  live   = true
  brand  = true
  blurb  = "<code>interp</code> is <code>numpy.interp</code>, <code>interp1d</code>, PCHIP, Akima, cubic, B- and smoothing splines and gridded interpolation; <code>poly</code> is <code>numpy.polyfit</code>, <code>roots</code> and the five <code>numpy.polynomial</code> bases, at or below NumPy's time. Chebyshev and AAA approximation and scattered data are planned."
[[params.orgs]]
  name   = "go-dsp"
  layer  = 1
  short  = "scipy.signal"
  lib    = "signal"
  state  = "signal v0.1.0"
  live   = true
  brand  = true
  blurb  = "<code>scipy.signal</code> in Go: IIR and FIR design (Butterworth to elliptic, Remez, least squares), filtering, convolution, Welch, spectrograms, resampling and peak finding, all 28 measured cases at or below SciPy's time. Wavelets and audio I/O are planned."
[[params.orgs]]
  name   = "go-symbolic"
  layer  = 1
  short  = "computer algebra"
  state  = "planned (wave 4)"
  live   = true
  brand  = true
  blurb  = "Computer algebra: expressions, simplification, differentiation, integration and equation solving, the core of what Mathematica does symbolically."
[[params.orgs]]
  name   = "go-mlkit"
  layer  = 1
  short  = "machine learning"
  state  = "planned (wave 3)"
  live   = true
  brand  = true
  blurb  = "Machine learning on go-ndarray arrays: clustering, classification and regression models, and model selection."
[[params.orgs]]
  name   = "go-autodiff"
  layer  = 1
  short  = "automatic differentiation"
  state  = "planned (wave 2)"
  live   = true
  brand  = true
  blurb  = "Automatic differentiation, forward and reverse mode, for the optimisers, solvers and models of the other organisations."
[[params.orgs]]
  name   = "go-geometry"
  layer  = 1
  short  = "computational geometry"
  state  = "planned (wave 2)"
  live   = true
  brand  = true
  blurb  = "Robust predicates, convex hulls, Delaunay triangulations, Voronoi diagrams, k-d trees and mesh generation."
[[params.orgs]]
  name   = "go-fem"
  layer  = 1
  short  = "finite elements, PDEs"
  state  = "planned (wave 3)"
  live   = true
  brand  = true
  blurb  = "Finite elements and PDE solvers on the meshes of go-geometry and the sparse solvers of go-sparse."
[[params.orgs]]
  name   = "go-graphalgo"
  layer  = 1
  short  = "graph algorithms"
  state  = "planned (wave 3)"
  live   = true
  brand  = true
  blurb  = "Graph algorithms: traversals, shortest paths, flows, matchings, connectivity and centrality."
[[params.orgs]]
  name   = "go-control"
  layer  = 1
  short  = "control systems, DAEs"
  state  = "planned (wave 3)"
  live   = true
  brand  = true
  blurb  = "Control systems (transfer functions, state space, analysis and design) and DAE solvers."
[[params.orgs]]
  name   = "go-units"
  layer  = 1
  short  = "units, physical constants"
  state  = "planned (wave 2)"
  live   = true
  brand  = true
  blurb  = "Units of measure with dimensional checking, and the physical constants."
[[params.orgs]]
  name   = "go-sciio"
  layer  = 0
  short  = "scientific file formats"
  state  = "planned (wave 2)"
  live   = true
  brand  = true
  blurb  = "Scientific file formats read into and written from go-ndarray arrays: HDF5, MAT, NetCDF, FITS, npy, Matrix Market, WAV and FLAC."

# The cards of #measured and their count come from this list. Each statement
# is from the document its link names.
[[params.claims]]
  name = "Accuracy against mpmath"
  what = "go-statistics measures every distribution function in ULPs against mpmath, with SciPy on the same points: at or below SciPy's error in 1473 of 1479 regions, the six exceptions under 4.5 ulp."
  href = "https://github.com/go-statistics/stats/blob/main/docs/accuracy.md"
  link = "go-statistics accuracy"
[[params.claims]]
  name = "Special functions in ULPs"
  what = "go-numerics' special functions, about 250 000 points in 419 regions over 62 functions: at or below SciPy's error in 418 regions."
  href = "https://github.com/go-numerics/special/blob/main/docs/accuracy.md"
  link = "go-numerics accuracy"
[[params.claims]]
  name = "NumPy's numbers, same seed"
  what = "go-ndarray's <code>random</code> is <code>numpy.random</code>: PCG64, MT19937, Philox, SFC64 and 40 samplers, bit-exact against NumPy 2.5.3 on x86-64, the few ULP-level exceptions listed."
  href = "https://github.com/go-ndarray/ndarray/blob/main/docs/random.md"
  link = "go-ndarray random"
[[params.claims]]
  name = "SciPy's draws, to the bit"
  what = "On that generator, go-statistics' draws of 17 distributions, Dirichlet and multinomial are bit-identical to SciPy's; the others are listed with how much they differ."
  href = "https://github.com/go-statistics/stats/blob/main/docs/rvs-table.md"
  link = "go-statistics draws"
[[params.claims]]
  name = "The reference's path"
  what = "116 of 124 fixture integrals take SciPy's exact QUADPACK subdivision path, and 110 of 120 <code>solve_ivp</code> runs its exact steps."
  href = "https://github.com/go-numerics/integrate"
  link = "go-numerics integrate"
[[params.claims]]
  name = "Faster than FFTW, and slower where it is"
  what = "At v0.27.0 go-fft is faster than FFTW on all 24 rows on Neoverse-N1 and at or above numpy.fft and scipy.fft on all 24 rows on every host measured; the tables include the rows FFTW wins."
  href = "https://github.com/go-fft/fft/blob/main/BENCHMARKS.md"
  link = "go-fft benchmarks"
[[params.claims]]
  name = "Against NumPy and OpenBLAS"
  what = "go-ndarray is faster on whole-array reductions and the <code>*Into</code> forms of elementwise operations, and slower on <code>MatMul</code> against 16-thread OpenBLAS from 512²."
  href = "https://github.com/go-ndarray/ndarray/blob/main/docs/perf.md"
  link = "go-ndarray performance"
[[params.claims]]
  name = "pandas' answers, polars' speed"
  what = "go-dataframe replays 173 cases recorded from pandas 3.0; polars is faster on most of the operations measured, and the numbers say by how much."
  href = "https://github.com/go-dataframe/dataframe/blob/main/docs/perf.md"
  link = "go-dataframe performance"
[[params.claims]]
  name = "matplotlib's ticks"
  what = "go-plot's tick locations, labels and offset text on 408 axes of real figures: every location bit for bit, every label character for character."
  href = "https://github.com/go-plot/plot/blob/main/docs/design.md"
  link = "go-plot design"

# The roadmap section (#roadmap). Every statement is from
# https://github.com/go-scikit/roadmap (PLAN.md and STATUS.md); the new
# organisations that have a landing and a documentation site carry `site` and
# `docs`; the others link to their GitHub pages.
[[params.waves]]
  name  = "Wave 1: the everyday MATLAB core"
  what  = "Correctly rounded <code>big.Float</code> functions and a Go oracle harness; sparse matrices and iterative solvers; interpolation and splines; filter design and spectral estimation."
  homes = "go-bignum, go-sparse, go-approx, go-dsp"
[[params.waves]]
  name  = "Wave 2: models and geometry"
  what  = "Constrained and global optimisation; linear models and GLM; exact predicates, Delaunay, Voronoi; automatic differentiation; units; scientific file formats; dense linear algebra additions."
  homes = "go-numerics/optimize, go-statistics/models, go-geometry, go-autodiff, go-units, go-sciio, go-ndarray/linalg"
[[params.waves]]
  name  = "Wave 3: systems, PDEs, 3D, interactivity"
  what  = "3D plots and <code>Manipulate</code>; control systems; meshing and finite elements; sparse direct solvers, wavelets, Chebyshev and AAA; machine learning and time series; graph algorithms and layouts."
  homes = "go-plot, go-notebook, go-control, go-geometry, go-fem, go-sparse, go-dsp, go-approx, go-mlkit, go-statistics/timeseries, go-graphalgo, go-graphdrawing"
[[params.waves]]
  name  = "Wave 4: Mathematica's core"
  what  = "Ball arithmetic, N-digit special functions and number theory; computer algebra."
  homes = "go-bignum, go-symbolic"

# Every field below is rendered by layouts/index.html (#repos). A field
# nothing renders does not stay true.
[[params.repos]]
  name  = "go-scikit.github.io"
  kind  = "site"
  href  = "https://github.com/go-scikit/go-scikit.github.io"
  blurb = "This page (Hugo, on the go-fleettools landing kit). The notebook in the hero is run again by CI, which fails if its output changes."
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-scikit/brand"
  blurb = "Logos and icons in SVG / PNG / JPG / ICO / ICNS; the mark is the stack, written by a Go program from the list of member organisations."
[[params.repos]]
  name  = "docs"
  kind  = "docs"
  href  = "https://github.com/go-scikit/docs"
  blurb = "The documentation site (Hugo and Hextra), served at go-scikit.github.io/docs: the member organisations with their landing and docs links, and the status of the parity-plan packages."
[[params.repos]]
  name  = "ruby"
  kind  = "bindings"
  href  = "https://github.com/go-scikit/ruby"
  blurb = "Ruby bindings to the stack, for go-embedded-ruby (v0.1.0): <code>Stats</code>, <code>Special</code>, <code>Optimize</code>, <code>Integrate</code>, <code>DataFrame</code> and <code>Plot</code>, each compared with the Go call it wraps, and the runner of a notebook's <code>ruby</code> cells."
[[params.repos]]
  name  = "roadmap"
  kind  = "plan"
  href  = "https://github.com/go-scikit/roadmap"
  blurb = "The parity plan with MATLAB and Mathematica: the home of each domain, the four waves, the status of each item and the bibliography."
[[params.repos]]
  name  = ".github"
  kind  = "profile"
  href  = "https://github.com/go-scikit/.github"
  blurb = "The organisation profile and the shared Renovate preset."

[params.brand]
